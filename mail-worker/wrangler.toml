name = "sevn77cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_als"]	#i18n 按请求隔离语言所需
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "sevenmail"		#d1数据库名字
database_id = "955c2135-9e46-486a-b99f-30a149895ad4"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "7740c84c8be841c0a4b1012ef9bf6889"					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#每30分钟刷新分析缓存，每天晚上12点执行每日任务


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串
#pwd_iterations = 10000		#密码 PBKDF2 迭代次数,默认10000,付费套餐建议100000(上限)
#resend_webhook_secret = ""	#Resend Webhook 签名密钥(whsec_开头),配置后校验回调签名
#cors_origin = ""			#允许跨域访问的来源,多个用逗号分隔,不填允许所有
#expose_error = false		#是否向前端返回未知异常详情,仅调试时开启
#admin_only = true		#超级管理员单用户模式(默认开启):关闭注册/LinuxDo,只有 admin 可登录;设为 false 恢复多用户
#init_secret = ""		#独立的初始化密钥,访问 /api/init/<init_secret>;不填时沿用 jwt_secret
#init_disabled = false		#初始化完成后设为 true,彻底关闭 /api/init 入口

# (可选)登录限流,原子计数,比 KV 计数更可靠
#[[unsafe.bindings]]
#name = "login_limiter"
#type = "ratelimit"
#namespace_id = "1001"
#simple = { limit = 10, period = 60 }

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
